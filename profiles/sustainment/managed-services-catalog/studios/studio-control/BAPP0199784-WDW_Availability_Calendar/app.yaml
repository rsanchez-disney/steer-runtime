bapp_id: "BAPP0199784"
app_name: "wdw-availability-calendar"
full_name: "WDW Availability Calendar"
description: >
  WDW Availability Calendar. Guest-facing calendar displaying ticket availability dates.
  Lambda-based architecture with API Gateway, S3 (SPA), and Kinesis streams.
  Currently migrating from GitLab to GitHub + Harness (in progress).
  Keywords: availability calendar, avlcal, ticket dates, park availability, guest-facing.
support_studio: "Studio Control"
escalation_channel: "https://teams.microsoft.com/l/channel/19%3AN7ofY17C8fye-1cs5yLhUrSLaWsp4ggdGhUEBA24bIM1%40thread.tacv2/DX%20-%20Studio%20Control"
escalation_contacts:
  - name: "Victor Ramirez"
    role: "primary"
    contact: "Victor.Ramirez.-ND@disney.com"
servicenow:
  configuration_items:
    - "WDW Availability Calendar - AWS Latest"
    - "WDW Availability Calendar - AWS Load Test"
    - "WDW Availability Calendar - AWS Production"
    - "WDW Availability Calendar - AWS Stage"
  assignment_group: "web-global-salestickets"
documentation:
  runbook: "https://disneyexperiences.atlassian.net/wiki/spaces/StudioControl/pages/365789718"
  architecture: "https://docs.google.com/drawings/d/1YiagVKdI9lCPjHi9j3gcFCieh20nrY4pzzpAhJAuxxk/edit"
  sre_runbook: "https://confluence.disney.com/spaces/WDWSRE/pages/544735438/Availability+Calendar+DLR+WDW+DLP"
  wiki: "https://disneyexperiences.atlassian.net/wiki/spaces/StudioControl/pages/365790210/WDW+Availability+Calendar"
docs:
  troubleshooting: "troubleshooting.md"
  business_rules: "business-rules.md"
  runbook: "runbook.md"
components:
  - component_name: "avlcal-wdw-lambda"
    component_type: "batch"
    description: "WDW Availability Calendar Lambdas"
    repository:
      url: "https://gitlab.disney.com/cgs-wdw/avlcal-wdw/avlcal-wdw-lambda"
      branch: "develop"
      notes: "Migrating to github.disney.com (in progress)"
    terraform:
      url: "https://gitlab.disney.com/cgs-wdw/avlcal-wdw/avlcal-wdw-lambda-terraform"
    cicd:
      platform: "gitlab"
      pipeline_url: "https://gitlab.disney.com/cgs-wdw/avlcal-wdw/avlcal-wdw-lambda/pipelines"
      notes: "Migrating to Harness (in progress)"
    health_check:
      url: "https://avail-calendar-wdw.wdprapps.disney.com/api/status"
      expected_status: 200
    splunk:
      index: "wdw_avail_cal"
      base_spl: "index=wdw_avail_cal"
      dashboard: "https://splunk.wdprapps.disney.com/en-US/app/launcher/wdw_avail_calendar"
    appdynamics:
      notes: "Does not support AppD yet"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      account_name: "wdpr-ecommerce-prod"
      infra_type: "Lambda"
      api_gateway: "avlcal-use1-prd-avail-calendar-api"
      lambda_functions:
        - "avlcal-use1-prd-avlcal-wdw-calendar"
        - "avlcal-use1-prd-avlcal-wdw-config"
        - "avlcal-use1-prd-avlcal-wdw-login"
        - "avlcal-use1-prd-avlcal-wdw-oidc"
        - "avlcal-use1-prd-avlcal-wdw-page-key-data"
        - "avlcal-use1-prd-avlcal-wdw-status"
        - "avlcal-use1-prd-avlcal-wdw-translate"
        - "avlcal-use1-prd-avlcal-wdw-ui-log"
        - "avlcal-use1-prd-avlcal-wdw-validate"
      kinesis_streams:
        - "avlcal-use1-<env>-avlcal-wdw-calendar"
        - "avlcal-use1-<env>-avlcal-wdw-config"
        - "avlcal-use1-<env>-avlcal-wdw-page-key-data"
        - "avlcal-use1-<env>-avlcal-wdw-status"
        - "avlcal-use1-<env>-avlcal-wdw-translate"
    other_environments:
      latest:
        health_check:
          url: "https://latest.avail-calendar-wdw.wdprapps.disney.com/api/status"
        cloud:
          account_name: "wdpr-ecommerce-dev"
          lambda_prefix: "avlcal-use1-lst-avlcal-wdw-"
      stage:
        health_check:
          url: "https://stage.avail-calendar-wdw.wdprapps.disney.com/api/status"
        cloud:
          account_name: "wdpr-ecommerce-test"
          lambda_prefix: "avlcal-use1-stg-avlcal-wdw-"
      load:
        health_check:
          url: "https://load.avail-calendar-wdw.wdprapps.disney.com/api/status"
        cloud:
          account_name: "wdpr-ecommerce-test"
          lambda_prefix: "avlcal-use1-lod-avlcal-wdw-"

  - component_name: "avlcal-wdw-spa"
    component_type: "frontend"
    description: "WDW Availability Calendar SPA (S3-hosted)"
    repository:
      url: "https://gitlab.disney.com/cgs-wdw/avlcal-wdw/avlcal-wdw-spa"
      branch: "develop"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      infra_type: "S3"
