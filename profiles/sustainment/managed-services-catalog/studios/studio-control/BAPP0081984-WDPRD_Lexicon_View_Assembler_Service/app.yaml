bapp_id: "BAPP0081984"
app_name: "wdw-lexvas"
full_name: "WDPRD Lexicon View Assembler Service"
description: >
  Lexicon View Assembler Service for WDW. Assembles product views from lexicon data.
  Two clusters: internal (usw2) and external (use1).
  Keywords: lexvas, product view, assembled entitlement, lexicon view, ticket catalog.
support_studio: "Studio Control"
escalation_channel: "https://teams.microsoft.com/l/channel/19%3AN7ofY17C8fye-1cs5yLhUrSLaWsp4ggdGhUEBA24bIM1%40thread.tacv2/DX%20-%20Studio%20Control"
escalation_contacts:
  - name: "Victor Ramirez"
    role: "primary"
    contact: "Victor.Ramirez.-ND@disney.com"
servicenow:
  configuration_items:
    - "WDPRD Lexicon View Assembler Service - WDW AWS Latest"
    - "WDPRD Lexicon View Assembler Service - WDW AWS Load Test"
    - "WDPRD Lexicon View Assembler Service - WDW AWS Production"
    - "WDPRD Lexicon View Assembler Service - WDW AWS Stage"
  assignment_group: "web-global-salestickets"
documentation:
  runbook: "https://confluence.disney.com/display/WDPROS/LexVAS+WDW"
  swagger: "https://latest.lexvas-wdw.wdprapps.disney.com/lexicon-view-assembler-service/docs/index.html"
  sonar: "https://sonar.cicd.wdprapps.disney.com/dashboard?id=com.disney.wdpro.service%3Alexicon-view-assembler-service"
docs:
  troubleshooting: "troubleshooting.md"
  business_rules: "business-rules.md"
  runbook: "runbook.md"
components:
  - component_name: "lexvas-api-ext"
    component_type: "api"
    description: "LexVAS External API (us-east-1) — guest-facing traffic"
    repository:
      url: "https://github.disney.com/commerce/wdpr-ecommerce-lexvas-api"
      branch: "develop"
    cicd:
      platform: "harness"
      pipeline_url: "https://disney.harness.io/ng/account/1-wFe3qRQv2mUh1s9244Eg/all/orgs/Commerce/projects/WDPRD_Lexicon_View_Assembler_Service/deployments"
    health_check:
      url: "https://lexiconvas-wdw.wdprapps.disney.com/lexicon-view-assembler-service/health/deep"
      expected_status: 200
    splunk:
      index: "wdpr-ecommerce"
      base_spl: "index=wdpr-ecommerce ecs_cluster=\"wdw-ecommerce-S0001591-use1-<env>*\" ecs_task_definition=\"lexvas-api*\""
      dashboards:
        metrics: "https://splunk.wdprapps.disney.com/en-US/app/launcher/studio_control__wdw_lexvas_metrics"
    appdynamics:
      app_name: "prod_ecommerce-S0001591_aws"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      infra_type: "ECS"
      cluster_id: "wdw-ecommerce-S0001591-use1-<env>"
      service_name: "lexvas-api"
    other_environments:
      latest:
        health_check:
          url: "https://latest.lexiconvas-wdw.wdprapps.disney.com/lexicon-view-assembler-service/health/deep"
      stage:
        health_check:
          url: "https://stage.lexiconvas-wdw.wdprapps.disney.com/lexicon-view-assembler-service/health/deep"
      load:
        health_check:
          url: "https://load.lexiconvas-wdw.wdprapps.disney.com/lexicon-view-assembler-service/health/deep"

  - component_name: "lexvasint"
    component_type: "api"
    description: "LexVAS Internal API (us-west-2)"
    repository:
      url: "https://github.disney.com/commerce/wdpr-ecommerce-lexvas-api"
      branch: "develop"
    splunk:
      index: "wdpr-ecommerce"
      base_spl: "index=wdpr-ecommerce ecs_cluster=\"wdw-ecommerce-S0001591-usw2-<env>*\" ecs_task_definition=\"lexvasint*\""
    cloud:
      provider: "AWS"
      region: "us-west-2"
      infra_type: "ECS"
      cluster_id: "wdw-ecommerce-S0001591-usw2-<env>"
      service_name: "lexvasint"
