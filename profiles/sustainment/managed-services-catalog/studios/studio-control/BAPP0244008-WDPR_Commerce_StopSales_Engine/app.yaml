bapp_id: "BAPP0244008"
app_name: "stopsales-engine"
full_name: "WDPR Commerce StopSales Engine"
description: >
  Stop Sales Engine service and updater lambda. Processes stop sales rules and publishes
  to Redis for consumption by EAS and other services.
  Keywords: stop sales engine, stopsales updater, blackout engine, redis publish.
support_studio: "Studio Control"
escalation_channel: "https://teams.microsoft.com/l/channel/19%3AN7ofY17C8fye-1cs5yLhUrSLaWsp4ggdGhUEBA24bIM1%40thread.tacv2/DX%20-%20Studio%20Control"
escalation_contacts:
  - name: "Victor Ramirez"
    role: "primary"
    contact: "Victor.Ramirez.-ND@disney.com"
servicenow:
  configuration_items:
    - "WDPR Commerce StopSales Engine - AWS Latest"
    - "WDPR Commerce StopSales Engine - AWS Load Test"
    - "WDPR Commerce StopSales Engine - AWS Production"
    - "WDPR Commerce StopSales Engine - AWS Stage"
  assignment_group: "web-global-salestickets"
documentation:
  runbook: "https://confluence.disney.com/display/WDPROS/Stop+Sales+Service+-+Runbook"
  sonar: "https://sonar.cicd.wdprapps.disney.com/portfolio?id=Scott-DePriest_Service_New"
docs:
  troubleshooting: "troubleshooting.md"
  business_rules: "business-rules.md"
  runbook: "runbook.md"
components:
  - component_name: "stopsales-svc"
    component_type: "api"
    description: "Stop Sales Service (Fargate)"
    repository:
      url: "https://github.disney.com/commerce/stopsales-svc"
      branch: "develop"
    health_check:
      url: "https://stopsales-wdw.wdprapps.disney.com/stopsales/actuator/info"
      expected_status: 200
    splunk:
      index: "wdpr_wdw_sss"
      base_spl: "index=wdpr_wdw_sss stream=stopsales-use1-<env>-stopsales-fargate"
      dashboards:
        services: "https://splunk.wdprapps.disney.com/en-US/app/launcher/pearl__stop_sales__services_dashboard"
      alerts:
        - "Redis replication lag alert"
    appdynamics:
      dashboard_url: "https://disney-preprod.saas.appdynamics.com/controller/#/location=APP_DASHBOARD"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      infra_type: "Fargate"
      services:
        - type: "elasticache"
          name: "stopsales-use1-prd-stopsales.xuqkma.ng.0001.use1.cache.amazonaws.com"
          read_replica: "stopsales-use1-prd-stopsales-ro (if available)"
    other_environments:
      latest:
        health_check:
          url: "https://latest.stopsales-wdw.wdprapps.disney.com/stopsales/actuator/info"
        cloud:
          services:
            - type: "elasticache"
              name: "stopsales-use1-lst-stopsales.rvhfcl.ng.0001.use1.cache.amazonaws.com"
              read_replica: "stopsales-use1-lst-stopsales-ro.rvhfcl.ng.0001.use1.cache.amazonaws.com"
      stage:
        health_check:
          url: "https://stage.stopsales-wdw.wdprapps.disney.com/stopsales/actuator/info"
        cloud:
          services:
            - type: "elasticache"
              name: "stopsales-use1-stg-stopsales.fwkg1l.ng.0001.use1.cache.amazonaws.com"
              read_replica: "stopsales-use1-stg-stopsales-ro.fwkg1l.ng.0001.use1.cache.amazonaws.com"
      load:
        health_check:
          url: "https://load.stopsales-wdw.wdprapps.disney.com/stopsales/actuator/info"
        cloud:
          services:
            - type: "elasticache"
              name: "stopsales-use1-lod-stopsales.fwkg1l.ng.0001.use1.cache.amazonaws.com"

  - component_name: "stopsales-updater"
    component_type: "batch"
    description: "Stop Sales Updater Lambda"
    repository:
      url: "https://github.disney.com/commerce/stopsales-svc"
      branch: "develop"
    splunk:
      index: "wdpr_wdw_sss"
      base_spl: "index=wdpr_wdw_sss stream IN (*ssupdater-use1-<env>-ssupdater-lambda*)"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      infra_type: "Lambda"
