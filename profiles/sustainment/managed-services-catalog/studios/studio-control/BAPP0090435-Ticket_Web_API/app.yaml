bapp_id: "BAPP0090435"
app_name: "ticket-web-api"
full_name: "Ticket Web API"
description: >
  Ticket Web API — BFF (Backend For Frontend) that serves Tickets SPA and Mods SPA.
  Node.js API that orchestrates calls to LexVAS, EAS, and other backend services.
  The same BAPP ID covers the API, Tickets SPA, and Mods SPA.
  Keywords: ticket api, tickets spa, mods spa, BFF, ticket purchase, ticket modification.
support_studio: "Studio Control"
escalation_channel: "https://teams.microsoft.com/l/channel/19%3AN7ofY17C8fye-1cs5yLhUrSLaWsp4ggdGhUEBA24bIM1%40thread.tacv2/DX%20-%20Studio%20Control"
escalation_contacts:
  - name: "Victor Ramirez"
    role: "primary"
    contact: "Victor.Ramirez.-ND@disney.com"
servicenow:
  configuration_items:
    - "Ticket Web API - AWS Latest"
    - "Ticket Web API - AWS Load Test"
    - "Ticket Web API - AWS Production"
    - "Ticket Web API - AWS Stage"
  assignment_group: "web-global-salestickets"
documentation:
  wiki: "https://disneyexperiences.atlassian.net/wiki/spaces/StudioControl/pages/365789685/Ticket+API"
  tickets_spa_wiki: "https://disneyexperiences.atlassian.net/wiki/spaces/StudioControl/pages/365789244"
  mods_spa_wiki: "https://disneyexperiences.atlassian.net/wiki/spaces/StudioControl/pages/365789561"
  show_park_hours: "https://disneyexperiences.atlassian.net/wiki/spaces/StudioControl/pages/365789650/Tickets+Spa+Mods+Spa+-+Show+Park+Hours"
docs:
  troubleshooting: "troubleshooting.md"
  business_rules: "business-rules.md"
  runbook: "runbook.md"
components:
  - component_name: "tickets-api"
    component_type: "api"
    description: "Ticket Web API — Node.js BFF for tickets and mods SPAs"
    repository:
      url: "https://github.disney.com/dprd-web-components-tickets/tickets-api"
      branch: "develop"
    cicd:
      platform: "nimbus"
      rundeck_url: "https://rundeck.wdprapps.disney.com/project/tickets-api_aws/jobs"
      nimbus_config: "https://github.disney.com/se-wdpr-infrastructure/nimbus_deploy/blob/master/tickets-api/latest/nimbus_cfg.json"
    health_check:
      url: "https://ticket-api-wdw-int.wdprapps.disney.com/ticket-api/healthcheck"
      expected_status: 200
    splunk:
      index: "wdpr_commerce_ui"
      base_spl: "index=wdpr_commerce_ui"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      account_name: "wdpr-ticketing-dev"
      infra_type: "ECS"
      cluster_id: "wdw-ticketing2-S0015604-use1-<env>"
      service_name: "ticket-web-api"
    other_environments:
      latest:
        health_check:
          url: "https://latest.ticket-api-wdw-int.wdprapps.disney.com/ticket-api/healthcheck"
      stage:
        health_check:
          url: "https://stage.ticket-api-wdw-int.wdprapps.disney.com/ticket-api/healthcheck"
      load:
        health_check:
          url: "https://load.ticket-api-wdw-int.wdprapps.disney.com/ticket-api/healthcheck"

  - component_name: "tickets-spa"
    component_type: "frontend"
    description: "WDW Tickets SPA — guest-facing ticket purchase flow"
    repository:
      url: "https://github.disney.com/dprd-web-components-tickets/tickets-spa"
      branch: "develop"
    splunk:
      index: "wdpr_commerce_ui"
      base_spl: "index=wdpr_commerce_ui"
    appdynamics:
      notes: "Does not support AppD yet"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      infra_type: "S3"
      s3_bucket: "wdat-wdprapps-disney-com"
      s3_prefix: "dprd-web-components-tickets/tickets-spa/"
    guest_urls:
      latest: "https://latest.disneyworld.disney.go.com/admission/tickets/"
      stage: "https://stage.disneyworld.disney.go.com/admission/tickets/"
      load: "https://lt01.disneyworld.disney.go.com/admission/tickets/"
      production: "https://disneyworld.disney.go.com/admission/tickets/"

  - component_name: "mods-spa"
    component_type: "frontend"
    description: "WDW Mods SPA — guest-facing ticket modification flow"
    repository:
      url: "https://github.disney.com/dprd-web-components-cart/mods-spa"
      branch: "develop"
    splunk:
      index: "wdpr_commerce_ui"
      base_spl: "index=wdpr_commerce_ui"
    appdynamics:
      notes: "Does not support AppD yet"
    cloud:
      provider: "AWS"
      region: "us-east-1"
      infra_type: "S3"
      s3_bucket: "wdat-wdprapps-disney-com"
      s3_prefix: "dprd-web-components-cart/mods-spa/"
    guest_urls:
      latest: "https://latest.disneyworld.disney.go.com/trip/my-vacation/modify-tickets/"
      stage: "https://stage.disneyworld.disney.go.com/trip/my-vacation/modify-tickets/"
      load: "https://lt01.disneyworld.disney.go.com/trip/my-vacation/modify-tickets/"
      production: "https://disneyworld.disney.go.com/trip/my-vacation/modify-tickets/"
