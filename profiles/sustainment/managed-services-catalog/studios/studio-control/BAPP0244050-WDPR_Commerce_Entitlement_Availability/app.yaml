bapp_id: "BAPP0244050"
app_name: "eas"
full_name: "Entitlement Availability Service (EAS)"
description: >
  Lambda built to combine information from Stop Sales Service and CME Availability into a single
  flag to indicate salability for a particular date and sku. The Lambda is designed only for skus
  that are date-specific (theme park tickets, water parks, special events).
  Dependencies: StopSales Service (Redis), CME Availability Service, LexVAS, EAPI, AuthZ.
  Keywords: entitlement availability, EAS, ticket availability, salability, stop sales, date-specific.
support_studio: "Studio Control"
escalation_channel: "https://teams.microsoft.com/l/channel/19%3AN7ofY17C8fye-1cs5yLhUrSLaWsp4ggdGhUEBA24bIM1%40thread.tacv2/DX%20-%20Studio%20Control"
escalation_contacts:
  - name: "Victor Ramirez"
    role: "primary"
    contact: "Victor.Ramirez.-ND@disney.com"
servicenow:
  configuration_items:
    - "WDPR Commerce Entitlement Availability - AWS Latest"
    - "WDPR Commerce Entitlement Availability - AWS Stage"
    - "WDPR Commerce Entitlement Availability - AWS Load Test"
    - "WDPR Commerce Entitlement Availability - AWS Production"
  assignment_group: "web-global-salestickets"
documentation:
  runbook: "https://confluence.disney.com/pages/viewpage.action?spaceKey=WDPROS&title=EAS+-+Entitlement+Availability+Service+-+Runbook"
  openapi: "https://github.disney.com/commerce/entlavail-lambda/blob/main/lambdas/get-documentation/documentation/openapi.json"
docs:
  troubleshooting: "troubleshooting.md"
  business_rules: "business-rules.md"
  runbook: "runbook.md"
components:
