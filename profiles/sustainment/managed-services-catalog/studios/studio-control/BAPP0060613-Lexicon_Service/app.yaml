bapp_id: "BAPP0060613"
app_name: "lexicon-service"
full_name: "Lexicon Service"
description: >
  Lexicon Service is a CRUD Restful Java API abstraction layer used by Lexicon UI and
  Lexicon View Assembler Service to update Lexicon data (product catalog for ticketing).
  Keywords: lexicon, product catalog, ticket definitions, entitlement types, CRUD.
